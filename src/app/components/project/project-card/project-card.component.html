<div class="project-card" id="${_card.folder}">
	<div class="project-card__header">
		<svg class="project-card__icon" viewBox="0 0 24 24" aria-hidden="true">${raw(projectIcons[_card.folder])}</svg>
		<h3 class="project-card__title">
			<button type="button" class="project-card__button" aria-describedby="${_card.folder}-tagline" data-event="click:_openModal">${_card.project.name}</button>
		</h3>
	</div>
	<p class="project-card__tagline" id="${_card.folder}-tagline">${_card.project.tagline}</p>
</div>
