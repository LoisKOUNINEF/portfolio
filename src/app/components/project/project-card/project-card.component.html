<div class="card group relative grid grid-cols-[minmax(0,1fr)_11rem] items-center gap-large h-full scroll-mt-24 cursor-pointer transition-[border-color] duration-fast ease-in-out hover:border-primary has-[button:focus-visible]:outline-2 has-[button:focus-visible]:outline-primary has-[button:focus-visible]:outline-offset-2 max-medium:grid-cols-[minmax(0,1fr)] motion-reduce:transition-none" id="${_card.folder}">
	<div>
		<div class="card-header">
			<svg class="card-icon transition-[scale] duration-fast ease-in-out group-hover:scale-110 motion-reduce:transition-none" viewBox="0 0 24 24" aria-hidden="true">${raw(projectIcons[_card.folder])}</svg>
			<h3>
				<button type="button" class="project-card__button card-title p-0 border-none bg-transparent [font-family:inherit] text-start cursor-pointer after:absolute after:inset-0 supports-[selector(:has(*))]:focus-visible:outline-none" aria-describedby="${_card.folder}-tagline" data-event="click:_openModal">${_card.project.name}</button>
			</h3>
		</div>
		<p class="text-[0.95rem] leading-[1.6] text-text" id="${_card.folder}-tagline">${_card.project.tagline}</p>
	</div>
	${_card.project.imageSrc
		? html`<div class="project-card__thumb aspect-video rounded-large overflow-hidden max-medium:-order-1 [&_picture]:block [&_picture]:w-full [&_picture]:h-full" data-component="project-card-picture"></div>`
		: html`<div class="aspect-video rounded-large overflow-hidden bg-[color-mix(in_srgb,var(--text),transparent_90%)] max-medium:hidden" aria-hidden="true"></div>`}
</div>
