<article class="project-modal__wrapper">
  <div class="project-modal__container">
    <div class="project-modal__content">
      <div data-component="${_project.name}-modal-header"></div>
      <div data-catalog="${_project.name}-modal-sections"></div>
      <p data-optional class="project-modal__conclusion">${_project.conclusion}</p>
      <div class="project-modal__links">
        <p data-component="${_project.name}-modal-links"></p>
      </div>
    </div>
  </div>
</article>
