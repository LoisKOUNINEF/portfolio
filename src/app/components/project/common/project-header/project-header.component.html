<div class="project-header__container">
	<div class="project-header__title">
		<h2>${_config.name}</h2>
		<div data-optional class="project-header__tags" data-catalog="project-header-tags"></div>
	</div>
	<p data-component="project-header-tech-string"></p>
	<div class="project-header__images ${_config.displayTechIcons ? '' : 'u-hide'}">
		<div class="project-header__screen-mock ${_config.displayTechIcons && _config.imageSrc ? '' : 'u-hide'}">
			<div data-component="project-header-picture"></div>
			<div class="project-header__screen-mock-stand"></div>
		</div>
		<p class="svgs__container project-header__svgs" data-catalog="project-header-technos"></p>
	</div>
	<p class="project-header__tagline">${_config.tagline}</p>
</div>
