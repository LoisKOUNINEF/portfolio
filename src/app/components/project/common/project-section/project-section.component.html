<div class="project-section__container ${imageModifier(_config)}">
	<div class="project-section__text">
		<h5 class="project-section__name">${_config.sectionName}</h5>
		<h6 data-optional class="project-section__head">${_config.sectionHead}</h6>
		<p data-optional class="project-section__content">${_config.sectionContent}</p>
		<div data-optional class="project-section__key-points" data-catalog="project-section-key-points"></div>
	</div>
	${_config.sectionImageSrc ? html`<div class="project-section__picture" data-component="project-section-picture"></div>` : ''}
</div>
