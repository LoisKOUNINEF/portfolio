<div class="section-wrapper @container">
	<div class="section-header">
		<h2 data-i18n="featured-project.title"></h2>
	</div>
	<div class="card flex w-[calc(var(--fp-text)+2rem+var(--fp-screen)+2.5rem+1px)] max-w-full items-center gap-largest [--card-padding-small:var(--card-padding)] [--fp-inner:calc(100cqw-2.5rem-1px)] [--fp-text:calc(var(--fp-inner)*0.6-2rem)] [--fp-screen:min(calc(var(--fp-inner)*0.4),17rem)] max-medium:flex-col-reverse max-medium:items-stretch max-medium:w-auto not-max-medium:max-large:w-auto @max-[666px]:flex-col-reverse @max-[666px]:items-stretch">
		<div class="flex-[0_0_var(--fp-text)] text-text leading-[1.6] max-medium:flex-none not-max-medium:max-large:@min-[666px]:flex-[1_1_0] @max-[666px]:flex-none">
			<!-- Baseline: the logo's bottom edge sits on the title's text baseline -->
			<div class="flex items-baseline gap-small mb-small">
				<img class="flex-none w-auto h-8 max-medium:h-7" src="/assets/images/projects/nutin-logo.avif" alt="" width="252" height="272" decoding="async">
				<h3 class="font-secondary text-large font-bold text-primary pl-[.2rem]" data-i18n="featured-project.name"></h3>
			</div>
			<p class="mb-medium text-text-muted text-lg" data-i18n="featured-project.tagline"></p>
			<!-- Metrics of a freshly generated app: name/value pairs, a grid so the values line up -->
			<dl class="grid grid-cols-[auto_1fr] gap-x-medium gap-y-smallest mb-large py-small px-medium border border-border rounded-large bg-background text-small not-max-medium:max-large:whitespace-nowrap" aria-describedby="featured-project-metrics-note">
				<!-- The note spans both columns, so its width doesn't widen the names' column -->
				<dt id="featured-project-metrics-note" class="col-span-full mb-smallest text-smallest text-text-disabled" data-i18n="featured-project.metrics.note"></dt>
				<dd class="hidden"></dd>
				<dt class="font-semibold" data-i18n="featured-project.metrics.bundle"></dt>
				<dd data-i18n="featured-project.metrics.bundle-value"></dd>
				<dt class="font-semibold" data-i18n="featured-project.metrics.build"></dt>
				<dd data-i18n="featured-project.metrics.build-value"></dd>
				<dt class="font-semibold" data-i18n="featured-project.metrics.docker"></dt>
				<dd data-i18n="featured-project.metrics.docker-value"></dd>
			</dl>
			<ul class="flex flex-col gap-small mb-large pl-large list-disc leading-[2rem]">
				<li><strong class="font-bold" data-i18n="featured-project.highlight-1-title"></strong>: <span data-i18n="featured-project.highlight-1"></span></li>
				<li><strong class="font-bold" data-i18n="featured-project.highlight-2-title"></strong>: <span data-i18n="featured-project.highlight-2"></span></li>
				<li><strong class="font-bold" data-i18n="featured-project.highlight-3-title"></strong>: <span data-i18n="featured-project.highlight-3"></span></li>
			</ul>
			<div data-event="keydown:_onLinkKeydown:@event">
				<div data-component="featured-project-link" data-event="click:_onLinkClick:@event"></div>
			</div>
		</div>
		<div class="screen-mock shrink-0 w-[var(--fp-screen)] max-medium:hidden not-max-medium:max-large:shrink not-max-medium:max-large:min-w-[10rem] @max-[666px]:w-full">
			<div data-component="featured-project-picture"></div>
			<div class="screen-mock-stand"></div>
		</div>
	</div>
</div>
