<div class="featured-project__wrapper">
	<div class="featured-project__header">
		<h2 data-i18n="featured-project.title"></h2>
	</div>
	<div class="featured-project__content">
		<div class="featured-project__text">
			<h3 class="featured-project__name" data-i18n="featured-project.name"></h3>
			<p class="featured-project__summary" data-i18n="featured-project.summary"></p>
			<ul class="featured-project__highlights">
				<li data-i18n="featured-project.highlight-1"></li>
				<li data-i18n="featured-project.highlight-2"></li>
				<li data-i18n="featured-project.highlight-3"></li>
			</ul>
			<div data-event="keydown:_onLinkKeydown:@event">
				<div data-component="featured-project-link" data-event="click:_onLinkClick:@event"></div>
			</div>
		</div>
		<div class="featured-project__screen">
			<div data-component="featured-project-picture"></div>
			<div class="featured-project__screen-stand"></div>
		</div>
	</div>
</div>
