<span class="info-card-icon text-large size-16 flex items-center justify-center shrink-0 max-medium:size-12">
	<img class="info-card-icon-img size-12 object-contain max-medium:size-9 ${_config.iconSrc.includes('github') ? 'dark:[filter:invert(1)]' : ''}" src="${_config.iconSrc}" alt="" data-optional="src">
</span>
<span class="info-card-content flex flex-col gap-[2px]">
	<span class="info-card-label font-bold text-medium" data-i18n="${_config.labelKey}"></span>
	<span class="info-card-subtext text-small font-normal opacity-65 empty:hidden" data-i18n="${_config.subtextKey}"></span>
</span>
