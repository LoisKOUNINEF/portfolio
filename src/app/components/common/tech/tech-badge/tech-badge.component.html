<span class="flex flex-col items-center">
  <span
    title="${_config.label}" 
    class="base-svg svg-${_config.svgKey ?? _config.value}"
  ></span>
  <span class="svg-tech-label font-secondary tracking-[0.1em] text-smallest">${_config.label}</span>
  <span data-optional="${_config.proficiency}" data-i18n="tech-badge.${_config.proficiency}" class="text-[0.65rem] whitespace-nowrap text-center ${_config.proficiency === 'primary' ? 'text-accent font-semibold' : 'text-text-muted'}"></span>
</span>
