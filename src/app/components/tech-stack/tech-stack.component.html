<div class="section-wrapper">
	<div class="section-header">
		<h2 data-i18n="tech-stack.title"></h2>
	</div>
	<div class="card-grid">
		${_groups.groups.map((group) => html`<div class="card card-nobg" id="tech-stack-${group.name}">
			<div class="card-header">
				<svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">${raw(group.icon)}</svg>
				<h3 class="card-title" data-i18n="tech-stack.${group.name}-title"></h3>
			</div>
			<div class="svgs__container flex-wrap items-start gap-large pt-small max-medium:gap-medium *:min-w-16 [&_.svg-tech-label]:pt-small [&_.svg-tech-label]:text-[0.8rem] [&_.svg-tech-label]:font-bold [&_.svg-tech-label]:opacity-75" data-catalog="${group.name}-badges"></div>
		</div>`)}
	</div>
</div>
