<div class="tech-stack__wrapper">
	<div class="tech-stack__header">
		<h2 data-i18n="tech-stack.title"></h2>
	</div>
	<div class="tech-stack__grid">
		${_groups.groups.map((group) => html`<div class="tech-stack__card" id="tech-stack-${group.name}">
			<div class="tech-stack__card-header">
				<svg class="tech-stack__icon" viewBox="0 0 24 24" aria-hidden="true">${raw(group.icon)}</svg>
				<h3 class="tech-stack__title" data-i18n="tech-stack.${group.name}-title"></h3>
			</div>
			<div class="svgs__container tech-stack__badges" data-catalog="${group.name}-badges"></div>
		</div>`)}
	</div>
</div>
