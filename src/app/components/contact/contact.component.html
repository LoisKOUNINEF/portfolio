<!-- Spacing and alignment come from the home view's contact/infos grid -->
<div class="p-0">
	<div class="w-full text-left">
		<div class="section-header">
			<h2 data-i18n="contact.title"></h2>
		</div>
		<!-- One column: the résumé card (home view) follows directly, spaced like the cards -->
		<div class="w-full pb-large grid grid-cols-[1fr] gap-medium max-medium:pb-medium [&_[data-component]]:contents">
			<span data-component="email-card"></span>
			<span data-component="linkedin-card"></span>
			<span data-component="github-card"></span>
		</div>
	</div>
</div>
