<div class="other-things__wrapper">
	<div class="other-things__container">
		<div class="other-things__header">
			<h1 data-i18n="other-things.title"></h1>
		</div>
		<div class="other-things__content">
			<section class="other-things__section">
				<div>
					<article class="other-things__presentation">
						<h3 data-i18n="other-things.carving-title"></h3>
						<p data-i18n="other-things.carving-content"></p>
					</article>
					<article class="other-things__presentation">
						<h3 data-i18n="other-things.board-title"></h3>
						<p data-i18n="other-things.board-content"></p>
					</article>
					<article class="other-things__presentation">
						<h3 data-i18n="other-things.marbles-title"></h3>
						<p data-i18n="other-things.marbles-content"></p>
					</article>
				</div>
				<aside class="other-things__image-wrapper">
					<button type="button" class="app-button other-things__thumbnail-button" aria-label="${I18nService.translate('other-things.thumbnail-label')}" data-event="click:_displayCarouselModal">
						<span data-component="other-things-thumbnail"></span>
					</button>
				</aside>
			</section>
		</div>
	</div>
</div>
