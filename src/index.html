<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="Professional portfolio: Loïs Kouninef, FullStack Web Developer." >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO meta -->
    <title>Loïs Kouninef — Fullstack Web Developer</title>
    <meta name="description" content="Professional portfolio of Loïs Kouninef, Fullstack Web Developer. Projects, skills and contact." />
    <link rel="canonical" href="https://lois-kouninef.eu/" />

    <!-- Control the SERP snippet: Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lois-kouninef.eu/" />
    <meta property="og:title" content="Loïs Kouninef — Fullstack Web Developer" />
    <meta property="og:description" content="Professional portfolio of Loïs Kouninef, Fullstack Web Developer. Projects, skills and contact." />
    <meta property="og:image" content="https://lois-kouninef.eu/assets/images/og-cover.jpg" />
    <!-- og:image should be ~1200×630 px -->

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loïs Kouninef — Fullstack Web Developer" />
    <meta name="twitter:description" content="Professional portfolio of Loïs Kouninef, Fullstack Web Developer. Projects, skills and contact." />
    <meta name="twitter:image" content="https://lois-kouninef.eu/og-cover.jpg" />

    <!-- Structured data — Person + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://lois-kouninef.eu/#website",
          "url": "https://lois-kouninef.eu/",
          "name": "Loïs Kouninef — Portfolio"
        },
        {
          "@type": "Person",
          "@id": "https://lois-kouninef.eu/#person",
          "name": "Loïs Kouninef",
          "url": "https://lois-kouninef.eu/",
          "jobTitle": "Fullstack Web Developer",
          "sameAs": [
            "https://github.com/LoisKOUNINEF/",
            "https://www.linkedin.com/in/loïs-kouninef/"
          ]
        },
        {
          "@type": "WebPage",
          "@id": "https://lois-kouninef.eu/#webpage",
          "url": "https://lois-kouninef.eu/",
          "name": "Loïs Kouninef — Fullstack web Developer",
          "description": "Professional portfolio of Loïs Kouninef, Fullstack Web Developer.",
          "isPartOf": { "@id": "https://lois-kouninef.eu/#website" },
          "about": { "@id": "https://lois-kouninef.eu/#person" }
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="/main.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <main id="app"></main>
  </body>
</html>
